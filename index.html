<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1226">
<!-- İçerik güvenlik politikası: yalnızca oyunun kendi dosyaları; dış kaynaktan kod, çerçeve, form yok; dışarıya bağlantı yok -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gleam Pop">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gleam Pop</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --bg:#0f1226; --panel:rgba(255,255,255,.07); --line:rgba(255,255,255,.1);
  --text:#f1f2fb; --muted:#a3a7c7; --accent:#ffd166; --danger:#ff6b6b;
}
/* Nunito yazı tipi: SIL Open Font License 1.1 (fonts/OFL.txt) - ticari kullanım serbest */
@font-face{font-family:'Nunito';src:url('fonts/Nunito.ttf') format('truetype');font-weight:200 1000;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(120% 80% at 50% 0%,#2a2f6b 0%,var(--bg) 62%) fixed,var(--bg);
  color:var(--text);
  font-family:'Nunito',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;min-height:100dvh;
  padding:calc(10px + env(safe-area-inset-top)) 16px calc(10px + env(safe-area-inset-bottom));
  overflow:hidden;overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit}
.wrap{
  width:min(100%,480px,calc(100vh - 290px));
  width:min(100%,480px,calc(100dvh - 290px));
  min-width:260px;
  display:flex;flex-direction:column;gap:11px;
}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:clamp(20px,6vw,28px);font-weight:800;letter-spacing:.5px;
  background:linear-gradient(90deg,#ff8a8a,#ffd166,#8ef0a8,#8ec5ff,#e0a8ff);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.icons{display:flex;gap:8px}
.icon-btn{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--line);flex:none;
  background:var(--panel);color:var(--text);display:grid;place-items:center;cursor:pointer;
}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:active{transform:scale(.94)}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;vertical-align:-.15em;flex:none;
  background:radial-gradient(circle at 35% 30%,#fff3b0,#ffcb3d 45%,#c98a00);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.sw8{display:inline-block;width:.85em;height:.85em;border-radius:28%;vertical-align:-.1em;box-shadow:0 0 0 2px rgba(255,255,255,.8)}

.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 6px;text-align:center}
.card .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.card .val{font-size:clamp(18px,5.5vw,24px);font-weight:800;font-variant-numeric:tabular-nums;display:inline-block}
.card .val.bump{animation:bump .3s ease-out}
.card.low .val{color:var(--danger)}
@keyframes bump{40%{transform:scale(1.25);color:var(--accent)}}

.progress{position:relative;height:22px;border-radius:11px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.progress .bar{position:absolute;inset:0 auto 0 0;width:0;border-radius:11px;
  background:linear-gradient(90deg,#3ddc7a,#ffd166);transition:width .45s ease-out}
.progress span{position:relative;display:block;text-align:center;font-size:12px;font-weight:700;line-height:20px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
body.endless .progress{display:none}

#board{
  position:relative;width:100%;aspect-ratio:1/1;border-radius:18px;overflow:hidden;
  background:repeating-conic-gradient(rgba(255,255,255,.045) 0 25%,transparent 0 50%) 0 0/25% 25%,rgba(255,255,255,.035);
  border:1px solid var(--line);
  box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 0 30px rgba(0,0,0,.3);
  touch-action:none;cursor:pointer;transition:box-shadow .2s;
}
#board.aiming{cursor:crosshair;box-shadow:0 0 0 3px #ffd166,0 0 30px rgba(255,209,102,.35),inset 0 0 30px rgba(0,0,0,.3)}
.tile{
  position:absolute;left:0;top:0;width:12.5%;height:12.5%;
  transition:transform 200ms cubic-bezier(.34,1.18,.64,1);
  will-change:transform;
}
.gem{
  position:absolute;inset:7%;border-radius:26%;overflow:hidden;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.35),0 3px 6px rgba(0,0,0,.35);
  transition:transform .15s ease,box-shadow .15s ease;
}
.gem::after{content:"";position:absolute;left:14%;top:9%;width:46%;height:26%;border-radius:50%;
  background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0))}
.gem::before{content:"";position:absolute;inset:22%;border-radius:30%;
  background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.35),rgba(255,255,255,0) 70%)}
.gem i{position:absolute;top:-25%;left:-70%;width:38%;height:150%;transform:rotate(25deg);opacity:0;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.8),rgba(255,255,255,0))}
.g0{background:radial-gradient(circle at 32% 25%,#ff9a9a,#e23b4a 55%,#9e1528)}
.g1{background:radial-gradient(circle at 32% 25%,#ffe49a,#f5a524 55%,#b06404)}
.g2{background:radial-gradient(circle at 32% 25%,#9af5b4,#22b85a 55%,#0e6e36)}
.g3{background:radial-gradient(circle at 32% 25%,#9acbff,#2f7bf0 55%,#163fa0)}
.g4{background:radial-gradient(circle at 32% 25%,#e6b4ff,#9b4dea 55%,#5a1b9c)}
.g5{background:radial-gradient(circle at 32% 25%,#ffc2e4,#f0459f 55%,#a3165f)}
.tile.sel{z-index:2}
.tile.sel .gem{transform:scale(1.1);box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.35),0 0 0 3px #fff,0 6px 14px rgba(0,0,0,.5)}
.tile.hint .gem{animation:hint 1s ease-in-out infinite}
.tile.pop{z-index:3}
.tile.pop .gem{animation:pop .28s ease-in forwards}
.tile.shake .gem{animation:shake .3s ease}
.tile.shine .gem i{animation:shine .8s ease-in-out}
.tile.land .gem{animation:land .28s ease-out}
.tile.flip .gem{animation:flip .34s ease-in-out}
@keyframes hint{50%{transform:scale(1.12);filter:brightness(1.25)}}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.28);filter:brightness(1.7)}100%{transform:scale(0) rotate(25deg);opacity:0}}
@keyframes shake{25%{transform:translateX(-8%)}75%{transform:translateX(8%)}}
@keyframes shine{0%{left:-70%;opacity:1}100%{left:130%;opacity:1}}
@keyframes land{0%{transform:translateY(6%) scale(1.1,.86)}55%{transform:translateY(-2%) scale(.96,1.05)}100%{transform:none}}
@keyframes flip{50%{transform:scale(0) rotate(90deg)}}
/* Özel bloklar: ışın (satır/sütun), bomba (3x3), prizma (bir rengin hepsi) */
.gem b{position:absolute;inset:0;display:none;pointer-events:none;border-radius:inherit}
.tile.sp-h .gem b,.tile.sp-v .gem b{display:block;
  background:linear-gradient(180deg,transparent 36%,rgba(255,255,255,.55) 42%,#fff 47%,#fff 53%,rgba(255,255,255,.55) 58%,transparent 64%);
  animation:beamGlow 1.3s ease-in-out infinite}
.tile.sp-h .gem b::before,.tile.sp-h .gem b::after,.tile.sp-v .gem b::before,.tile.sp-v .gem b::after{content:"";position:absolute;top:50%;width:0;height:0}
.tile.sp-h .gem b::before,.tile.sp-v .gem b::before{left:6%;border-top:9px solid transparent;border-bottom:9px solid transparent;border-right:9px solid #fff;margin-top:-9px}
.tile.sp-h .gem b::after,.tile.sp-v .gem b::after{right:6%;border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:9px solid #fff;margin-top:-9px}
.tile.sp-v .gem b{transform:rotate(90deg)}
@keyframes beamGlow{50%{opacity:.55}}
.tile.sp-b .gem{border-radius:50%}
.tile.sp-b .gem b{display:block;border-radius:50%;
  background:radial-gradient(circle,#fff 0 13%,rgba(255,255,255,.75) 19%,rgba(255,255,255,0) 44%);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.6),inset 0 0 12px rgba(255,255,255,.5);animation:bombPulse .9s ease-in-out infinite}
@keyframes bombPulse{50%{transform:scale(.82);opacity:.8}}
.gem.gp{background:#2a1f4a}
.tile.sp-p .gem b{display:block;inset:-30%;border-radius:0;
  background:conic-gradient(#ff6b78,#ffbe3d,#3ddc7a,#5b9bff,#bd7bff,#ff6fbf,#ff6b78);animation:prismSpin 2.4s linear infinite}
.tile.sp-p .gem::before{z-index:1;inset:30%;border-radius:50%;background:radial-gradient(circle,#fff 0 30%,rgba(255,255,255,0) 72%)}
.tile.sp-p .gem::after{z-index:1}
@keyframes prismSpin{to{transform:rotate(360deg)}}
.tile.forge{z-index:2}
.tile.forge .gem{animation:forge .5s ease-out}
@keyframes forge{0%{transform:scale(.5);filter:brightness(2.4)}55%{transform:scale(1.3);filter:brightness(1.6)}100%{transform:none}}
/* Engeller: buz (karenin üstünde, taş geçince kırılır) ve taş (eşleşmez, yanında patlama olunca çatlar) */
.ice{position:absolute;left:0;top:0;width:12.5%;height:12.5%;pointer-events:none;z-index:1;transition:opacity .3s}
.ice::before{content:"";position:absolute;inset:3%;border-radius:22%;
  background:linear-gradient(135deg,rgba(240,250,255,.6),rgba(170,215,255,.2) 40%,rgba(200,232,255,.22) 60%,rgba(240,250,255,.5));
  border:2px solid rgba(225,243,255,.95);box-shadow:inset 0 0 12px rgba(255,255,255,.7),0 0 10px rgba(150,210,255,.55)}
.ice.l2::before{background:linear-gradient(135deg,rgba(235,248,255,.62),rgba(170,215,255,.3) 45%,rgba(235,248,255,.5));border-width:3px}
.ice.l2::after{content:"";position:absolute;inset:3%;border-radius:22%;opacity:.7;
  background:linear-gradient(45deg,transparent 46%,rgba(255,255,255,.8) 48%,transparent 51%),linear-gradient(-30deg,transparent 60%,rgba(255,255,255,.7) 62%,transparent 65%)}
.ice.gone{opacity:0}
.ice.crack{animation:iceHit .3s ease}
@keyframes iceHit{40%{transform:scale(1.12)}}
.gem.gs{background:radial-gradient(circle at 32% 25%,#d9d3ca,#958d84 55%,#5d5650);border-radius:22%}
.tile.stone .gem b{display:block;border-radius:inherit;box-shadow:inset 0 0 0 3px rgba(60,52,46,.55);
  background:radial-gradient(circle at 24% 72%,rgba(70,62,56,.45) 0 7%,transparent 8%),radial-gradient(circle at 72% 30%,rgba(70,62,56,.4) 0 6%,transparent 7%)}
.tile.stone.hp2 .gem{background:radial-gradient(circle at 32% 25%,#b9b2a8,#77706a 55%,#45403b)}
.tile.stone.hp2 .gem b{box-shadow:inset 0 0 0 4px rgba(40,34,30,.6),inset 0 0 0 7px rgba(200,190,180,.25)}
.tile.stone.hp1 .gem b{background:linear-gradient(60deg,transparent 47%,rgba(40,34,30,.75) 49%,transparent 52%),linear-gradient(-50deg,transparent 54%,rgba(40,34,30,.65) 56%,transparent 59%),linear-gradient(10deg,transparent 30%,rgba(40,34,30,.5) 32%,transparent 35%)}
.tile.stone.hit .gem{animation:shake .3s ease}
.sw8.swice{background:linear-gradient(135deg,#eaf7ff,#9fd2ff)}
.sw8.swstone{background:radial-gradient(circle at 32% 25%,#d9d3ca,#958d84 55%,#5d5650)}
.node .badge.gem.bice{background:linear-gradient(135deg,#eaf7ff,#9fd2ff)}
.node .badge.gem.bstone{background:radial-gradient(circle at 32% 25%,#d9d3ca,#958d84 55%,#5d5650)}
/* Öğretici: kaydırma gösteren parmak izi */
#tut{position:absolute;inset:0;z-index:7;pointer-events:none}
#tut .finger{position:absolute;width:12.5%;height:12.5%;left:0;top:0;animation:tutSwipe 1.6s ease-in-out infinite}
#tut .finger::before{content:"";position:absolute;left:30%;top:30%;width:40%;height:40%;border-radius:50%;background:rgba(255,255,255,.95);
  box-shadow:0 0 0 6px rgba(255,255,255,.35),0 0 18px #fff}
@keyframes tutSwipe{0%,15%{transform:translate(var(--x0),var(--y0));opacity:0}25%{opacity:1}70%{transform:translate(var(--x1),var(--y1));opacity:1}85%,100%{transform:translate(var(--x1),var(--y1));opacity:0}}
.tutTip{position:absolute;left:50%;transform:translateX(-50%);top:3%;width:max-content;max-width:90%;z-index:8;pointer-events:none;
  background:#fff;color:#1b1f45;font-weight:800;font-size:15px;padding:10px 14px;border-radius:14px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.4);
  animation:tipIn .35s ease-out}
.tutTip.low{top:auto;bottom:3%}
@keyframes tipIn{from{opacity:0;transform:translate(-50%,8px)}}
/* Günlük görevler */
.mis{display:flex;flex-direction:column;gap:10px;text-align:left;margin:6px 0 4px}
.misRow{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.misRow b{font-size:14px}
.misRow .bar{grid-column:1;height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
.misRow .bar i{display:block;height:100%;background:linear-gradient(90deg,#3ddc7a,#ffd166)}
.misRow small{grid-column:1;color:var(--muted);font-size:12px}
.misRow .claim{grid-row:1 / span 3;grid-column:2;border:0;border-radius:12px;padding:8px 12px;font-weight:900;font-size:14px;cursor:pointer;
  color:#062a14;background:linear-gradient(#9af5b4,#2fcf6c);box-shadow:0 3px 0 #11743a;white-space:nowrap}
.misRow .claim:disabled{background:rgba(255,255,255,.1);color:var(--muted);box-shadow:none;cursor:default}
.misRow.done{opacity:.6}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
#board.quake{animation:quake .4s ease-out}
@keyframes quake{15%{transform:translate(-6px,3px) rotate(-.6deg)}30%{transform:translate(5px,-4px) rotate(.5deg)}
  45%{transform:translate(-4px,-2px)}60%{transform:translate(3px,3px)}80%{transform:translate(-1px,1px)}}
.flash{position:absolute;inset:0;z-index:4;pointer-events:none;
  background:radial-gradient(circle at var(--x) var(--y),rgba(255,255,255,.55),rgba(255,255,255,0) 55%);
  animation:flash .45s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}
.float{position:absolute;pointer-events:none;z-index:5;font-weight:800;color:#fff;white-space:nowrap;
  font-size:clamp(16px,5vw,24px);text-shadow:0 2px 6px rgba(0,0,0,.7);animation:float .9s ease-out forwards}
@keyframes float{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-170%) scale(1)}}
.banner{position:absolute;left:50%;top:50%;z-index:6;pointer-events:none;white-space:nowrap;
  font-size:clamp(24px,8.5vw,42px);font-weight:900;color:var(--accent);
  text-shadow:0 3px 0 #a0521a,0 6px 18px rgba(0,0,0,.6);animation:banner 1.1s ease-out forwards}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
  70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}

/* özel güçler */
.boosts{display:flex;gap:10px;justify-content:center}
.boost{position:relative;flex:1;max-width:86px;height:54px;border-radius:16px;border:1px solid var(--line);cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.05));color:#fff;font-size:24px;font-weight:900;
  box-shadow:0 4px 0 rgba(0,0,0,.3);display:grid;place-items:center}
.boost:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.boost .cnt{position:absolute;right:-6px;top:-8px;min-width:22px;height:22px;border-radius:11px;background:#ff5a6a;
  font-size:12px;line-height:22px;padding:0 6px;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.boost .cnt.plus{background:#3ddc7a}
.boost.on{background:linear-gradient(#ffe08a,#f5a524);color:#3a2200;box-shadow:0 0 0 3px #fff}
.boost:disabled{opacity:.3;cursor:default}
.boost.shopb{font-size:20px}
.foot{text-align:center;color:var(--muted);font-size:13px;min-height:16px}
.foot.aim{color:var(--accent);font-weight:700}

/* katmanlar */
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;
  background:rgba(8,10,25,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.show{opacity:1;pointer-events:auto}
.dialog{width:min(100%,340px);max-height:calc(100dvh - 32px);overflow-y:auto;background:#1b1f45;border:1px solid var(--line);border-radius:22px;
  padding:24px 20px;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.5);
  transform:scale(.9);transition:transform .3s cubic-bezier(.34,1.4,.64,1)}
.overlay.show .dialog{transform:scale(1)}
.dialog h2{font-size:24px;margin-bottom:6px}
.dialog .big{font-size:46px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums}
.dialog .rec{font-weight:700;min-height:22px;margin-bottom:14px;display:flex;flex-direction:column;gap:6px;align-items:center}
.stars{font-size:34px;letter-spacing:6px;color:#ffd166}
.stars em{font-style:normal;color:rgba(255,255,255,.18)}
.earn{font-size:18px;color:#ffe08a}
.giftline{color:#8ef0a8}
.btn{border:0;border-radius:14px;padding:14px 26px;font-size:17px;font-weight:800;cursor:pointer;
  color:#2a1a00;background:linear-gradient(#ffe08a,#f5a524);box-shadow:0 4px 0 #b06404}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b06404}
.btn.green{color:#062a14;background:linear-gradient(#9af5b4,#2fcf6c);box-shadow:0 4px 0 #11743a}
.btn.green:active{box-shadow:0 1px 0 #11743a}
.btns{display:flex;flex-direction:column;gap:10px;align-items:center}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;border:1px solid var(--line);padding:10px 24px;font-size:15px}
.btn.ghost:active{transform:scale(.97)}
.hide{display:none!important}

/* ana menü */
#menu{z-index:16;background:radial-gradient(120% 80% at 50% 0%,#2a2f6b 0%,var(--bg) 62%);backdrop-filter:none}
.menu{width:min(100%,340px);display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.logo{font-size:clamp(40px,13vw,56px);margin-bottom:4px}
.demo{display:flex;gap:7px;margin-bottom:14px}
.demo i{width:38px;height:38px;border-radius:26%;display:block;animation:bob 1.6s ease-in-out infinite;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.35),0 3px 6px rgba(0,0,0,.35)}
.demo i:nth-child(2){animation-delay:.15s}.demo i:nth-child(3){animation-delay:.3s}
.demo i:nth-child(4){animation-delay:.45s}.demo i:nth-child(5){animation-delay:.6s}.demo i:nth-child(6){animation-delay:.75s}
@keyframes bob{50%{transform:translateY(-10px)}}
.mode{width:100%;border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;color:var(--text);
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
  display:flex;flex-direction:column;gap:4px;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.mode b{font-size:21px}
.mode span{font-size:13px;color:var(--muted)}
.mode:active{transform:scale(.97)}
.corner{position:absolute;top:calc(14px + env(safe-area-inset-top))}
.corner.r{right:16px}.corner.l{left:16px}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:7px 12px;font-weight:800;font-size:15px;color:var(--text);white-space:nowrap}
.pill small{font-weight:600;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
button.pill{cursor:pointer}
.heart{color:#ff5a6a}

/* harita */
#map{z-index:15;display:flex;flex-direction:column;padding:0;place-items:stretch;background:#0d1530;backdrop-filter:none}
.maptop{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:rgba(13,18,40,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:2}
.maptop .grow{flex:1;min-width:0;font-size:20px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.maptop{gap:6px}
.maptop .pill{padding:6px 9px;gap:4px;font-size:14px}
.maptop .pill small{font-size:11px}
@media (max-width:400px){ .maptop .grow{font-size:17px} .maptop .icon-btn{width:36px;height:36px} }
.mapscroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.mapinner{position:relative;width:100%;max-width:480px;margin:0 auto;
  background:linear-gradient(to top,#123a3c 0%,#1a2c5c 25%,#2b1f5e 50%,#4a1f55 75%,#1c1446 100%)}
.mapinner svg{position:absolute;left:0;top:0}
.road-base{fill:none;stroke:rgba(0,0,0,.35);stroke-width:22;stroke-linecap:round}
.road{fill:none;stroke:rgba(255,255,255,.14);stroke-width:14;stroke-linecap:round}
.road-dash{fill:none;stroke:rgba(255,255,255,.35);stroke-width:2.5;stroke-dasharray:6 10;stroke-linecap:round}
.road-done{fill:none;stroke:#ffd166;stroke-width:8;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(255,209,102,.6))}
.dot{position:absolute;border-radius:50%;background:#fff;pointer-events:none}
.node{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:3px solid rgba(255,255,255,.25);
  font-size:21px;font-weight:900;color:#fff;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#7d86b8,#3b4170 60%,#262a4d);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.3),0 6px 14px rgba(0,0,0,.45)}
.node.done{border-color:rgba(255,255,255,.6);background:radial-gradient(circle at 35% 30%,#9af5b4,#22b85a 60%,#0e6e36)}
.node.cur{width:76px;height:76px;margin:-38px 0 0 -38px;font-size:26px;color:#3a2200;border-color:#fff;
  background:radial-gradient(circle at 35% 30%,#ffe49a,#f5a524 60%,#b06404);animation:curPulse 1.4s ease-in-out infinite}
@keyframes curPulse{50%{box-shadow:inset 0 -4px 0 rgba(0,0,0,.3),0 0 0 12px rgba(255,209,102,.2),0 6px 14px rgba(0,0,0,.45)}}
.node.locked{color:rgba(255,255,255,.35);cursor:default}
.node .st{position:absolute;left:50%;top:100%;transform:translateX(-50%);font-size:13px;letter-spacing:1px;color:#ffd166;
  white-space:nowrap;margin-top:3px;text-shadow:0 1px 2px #000}
.node .st em{color:rgba(255,255,255,.25);font-style:normal}
.node{overflow:visible}
.node .badge svg{width:18px;height:18px}
.node .badge{position:absolute;right:-12px;top:-12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-size:16px;line-height:1;background:radial-gradient(circle at 35% 30%,#ff9ab0,#e2365f 60%,#9e1538);
  border:2px solid #fff;box-shadow:0 3px 6px rgba(0,0,0,.5);animation:giftBob 1.8s ease-in-out infinite}
@keyframes giftBob{50%{transform:translateY(-4px) rotate(-8deg)}}
.node .badge.gem{width:22px;height:22px;right:-6px;top:-6px;border-radius:30%;border:2px solid #fff;animation:none}
.node .badge.gem.g0{background:radial-gradient(circle at 32% 25%,#ff9a9a,#e23b4a 55%,#9e1528)}
.node .badge.gem.g1{background:radial-gradient(circle at 32% 25%,#ffe49a,#f5a524 55%,#b06404)}
.node .badge.gem.g2{background:radial-gradient(circle at 32% 25%,#9af5b4,#22b85a 55%,#0e6e36)}
.node .badge.gem.g3{background:radial-gradient(circle at 32% 25%,#9acbff,#2f7bf0 55%,#163fa0)}
.node .badge.gem.g4{background:radial-gradient(circle at 32% 25%,#e6b4ff,#9b4dea 55%,#5a1b9c)}
.node .badge.gem.g5{background:radial-gradient(circle at 32% 25%,#ffc2e4,#f0459f 55%,#a3165f)}
.node:active:not(.locked){transform:scale(.94)}

/* mağaza */
#shop{z-index:25}
.shopbox{width:min(100%,380px);max-height:calc(100dvh - 32px);overflow-y:auto;background:#1b1f45;border:1px solid var(--line);
  border-radius:22px;padding:18px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.shophead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.shophead h2{font-size:22px}
.item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.item .ic{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:24px;font-weight:900;
  background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.05))}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:15px}
.item .tx span{font-size:12px;color:var(--muted)}
.item .own{font-size:12px;color:var(--muted)}
.buy{border:0;border-radius:12px;padding:9px 12px;font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap;
  color:#2a1a00;background:linear-gradient(#ffe08a,#f5a524);box-shadow:0 3px 0 #b06404;display:flex;align-items:center;gap:5px}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #b06404}
.buy:disabled{opacity:.45;cursor:default;transform:none}
.buy.shake{animation:shake2 .3s}
@keyframes shake2{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.sect{margin:16px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700}
.note{font-size:12px;color:var(--muted);margin-top:4px}
.tag{font-size:11px;background:#ff5a6a;color:#fff;border-radius:6px;padding:1px 5px;margin-left:4px;vertical-align:1px}

/* ayarlar */
#settings{z-index:30}
.sheet{display:flex;flex-direction:column;gap:6px;text-align:left}
.sheet h2{text-align:center;margin-bottom:8px}
.sheet .btn{margin-top:14px;align-self:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px;
  border-bottom:1px solid var(--line);font-size:16px;font-weight:600;cursor:pointer}
.row input{position:absolute;opacity:0;pointer-events:none}
.sw{position:relative;flex:none;width:50px;height:28px;border-radius:14px;background:rgba(255,255,255,.15);transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;
  box-shadow:0 2px 4px rgba(0,0,0,.4);transition:transform .2s cubic-bezier(.34,1.4,.64,1)}
.row input:checked + .sw{background:#3ddc7a}
.row input:checked + .sw::after{transform:translateX(22px)}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:800;font-size:14px;padding:7px 11px;border-radius:8px;cursor:pointer}
.seg button.on{background:#ffd166;color:#2a1a00}


/* ---- canlı ana menü ---- */
#menu{display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.mbg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.mbg i{position:absolute;top:105%;border-radius:26%;opacity:.3;animation:rise linear infinite;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.35)}
@keyframes rise{from{transform:translateY(0) rotate(0)}to{transform:translateY(-135vh) rotate(220deg)}}
.mtop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(14px + env(safe-area-inset-top)) 16px 0;z-index:2}
.mtop .grow{flex:1}
.pill .plus{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#3ddc7a;color:#062a14;font-size:14px;line-height:1;margin-left:2px;font-weight:900}
.menu{position:relative;z-index:1}
.logo{background:linear-gradient(90deg,#ff8a8a,#ffd166,#8ef0a8,#8ec5ff,#e0a8ff,#ff8a8a);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 6s linear infinite;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.35));font-weight:1000}
@keyframes shimmer{to{background-position:200% 0}}
.logo-wrap{position:relative}
.lspark{position:absolute;width:28px;height:28px;animation:twinkle 2.4s ease-in-out infinite}
.lspark svg{width:100%;height:100%;display:block}
.lspark.s1{right:-16px;top:-10px}.lspark.s2{left:-12px;bottom:-2px;width:18px;height:18px;animation-delay:1.2s}
@keyframes twinkle{0%,100%{transform:scale(.4) rotate(0);opacity:.3}50%{transform:scale(1) rotate(90deg);opacity:1}}
.play-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:14px;border:0;border-radius:24px;padding:14px 20px;cursor:pointer;
  color:#3a2200;background:linear-gradient(#ffe590,#f5a524);box-shadow:0 6px 0 #b06404,0 14px 30px rgba(245,165,36,.35);animation:playPulse 2s ease-in-out infinite}
.play-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b06404;animation:none}
.play-btn .pi{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.5);display:grid;place-items:center;flex:none}
.play-btn .pi svg{width:22px;height:22px;fill:#3a2200;margin-left:4px}
.play-btn .pt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.play-btn b{font-size:30px;font-weight:1000;letter-spacing:1px}
.play-btn small{font-size:13px;font-weight:800;opacity:.75}
@keyframes playPulse{50%{transform:scale(1.035)}}
.mrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.endless-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;border:0;border-radius:20px;padding:10px 18px;cursor:pointer;
  color:#04203f;background:linear-gradient(#a8d4ff,#4a9bff);box-shadow:0 5px 0 #1f5fb8,0 10px 24px rgba(74,155,255,.3);margin-top:-4px}
.endless-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1f5fb8}
.endless-btn .mi{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.5);display:grid;place-items:center;font-size:28px;font-weight:1000;line-height:1;flex:none}
.endless-btn .pt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.endless-btn b{font-size:20px;font-weight:1000}
.endless-btn small{font-size:12px;font-weight:800;opacity:.75}
.mini{position:relative;border:1px solid var(--line);border-radius:18px;padding:12px 4px 10px;cursor:pointer;color:var(--text);min-width:0;
  background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.04));display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 8px 18px rgba(0,0,0,.3)}
.mini:active{transform:scale(.95)}
.mini .mi{height:32px;display:grid;place-items:center;font-size:30px;line-height:1;font-weight:1000;color:#8ec5ff}
.mini .mi .ico{width:32px;height:32px}
.mini b{font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini small{font-size:11px;color:var(--muted);line-height:1.2}
.mini.ready{border-color:rgba(255,209,102,.7);animation:wiggle 2.6s ease-in-out infinite}
.mini .dotb{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:#ff5a6a;border:2px solid #fff}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-5deg)}90%{transform:rotate(5deg)}95%{transform:rotate(-3deg)}}
/* can penceresi */
#livesDlg{z-index:24}
#privacy{z-index:50}
.langsel{font:inherit;font-weight:800;font-size:15px;color:var(--text);background:rgba(255,255,255,.1);border:1px solid var(--line);
  border-radius:10px;padding:7px 10px;cursor:pointer;max-width:60%}
.langsel option{color:#111;background:#fff}
.row.vol{cursor:default}
.row.vol span{flex:none;min-width:96px}
.row.vol b{flex:none;width:38px;text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row input[type=range]{position:static;opacity:1;pointer-events:auto;flex:1;min-width:0;height:28px;accent-color:#ffd166;cursor:pointer}
#consent{z-index:45;background:radial-gradient(120% 80% at 50% 0%,#2a2f6b 0%,var(--bg) 62%)}
.consentbox{display:flex;flex-direction:column;align-items:center;gap:10px}
.cicon{width:64px;height:64px}.cicon svg{width:100%;height:100%}
.ctext{font-size:14px;line-height:1.5;color:#cfd2ea;margin:0 0 6px}
.btn.big{width:100%;padding:16px;font-size:19px}
.rowbtn{background:none;border-left:0;border-right:0;border-top:0;color:inherit;text-align:left;font-family:inherit;width:100%}
.rowsub{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
.row.locked{opacity:.55;cursor:default}
.ptext{font-size:13px;line-height:1.5;color:#cfd2ea;max-height:32vh;overflow-y:auto;background:rgba(0,0,0,.22);border-radius:12px;padding:10px 12px;margin-bottom:4px}
.ptext p{margin:0 0 8px}.ptext p:last-child{margin:0}
.ptext b{color:#fff}
#livesDlg .btns .btn:not(.ghost){width:100%}
.hearts{display:flex;justify-content:center;gap:6px;margin:6px 0 6px}
.hearts .ico{width:38px;height:38px}
.hearts .ico.off{filter:grayscale(1) brightness(.45)}
.lifeinfo{color:var(--muted);font-size:14px;margin-bottom:14px;font-variant-numeric:tabular-nums;min-height:20px}
.btn small{font-weight:700;opacity:.8}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.note2{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.4}
.goalbig{font-size:26px;color:var(--text);margin:6px 0 2px}
.week{display:flex;gap:5px;justify-content:center;margin-top:4px}
.week i{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.08);font-style:normal;font-size:13px;display:grid;place-items:center;color:var(--muted)}
.week i.got{background:linear-gradient(#ffe08a,#f5a524);color:#3a2200;font-weight:900}
/* oyun sonu reklam panosu */
#over{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
body.board-on #over .dialog{max-height:calc(100dvh - 300px)}
.adboard{width:300px;flex:none;text-align:center;margin-top:18px}
.adboard span{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.adslot{width:300px;height:250px;border-radius:8px}
.adslot.mock{border:2px dashed rgba(255,255,255,.25);display:grid;place-items:center;color:rgba(255,255,255,.45);font-weight:800;background:rgba(0,0,0,.25)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:23}
.ico{display:inline-block;width:1em;height:1em;vertical-align:-.14em;flex:none}
.ico svg{width:100%;height:100%;display:block}
.boost .ico{width:28px;height:28px}
.item.hl{background:linear-gradient(90deg,rgba(255,209,102,.16),rgba(255,209,102,.03));border:1px solid rgba(255,209,102,.4);border-radius:14px;padding:11px 10px;margin-bottom:6px}
.buy.blue{color:#04203f;background:linear-gradient(#a8d4ff,#4a9bff);box-shadow:0 3px 0 #1f5fb8}
.btn.blue{color:#04203f;background:linear-gradient(#a8d4ff,#4a9bff);box-shadow:0 4px 0 #1f5fb8}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;cursor:pointer;padding:6px}
.about{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.5}
#adMock{z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
#adMock .adbox{width:min(90vw,340px);aspect-ratio:9/12;border:2px dashed #555;border-radius:16px;display:grid;place-items:center;color:#aaa;font-weight:800;font-size:22px;padding:20px}
#adMock small{display:block;font-size:13px;font-weight:600;margin-top:8px}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;z-index:40;
  background:#262b5c;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;
  transition:opacity .25s,transform .25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){
  .tile{transition-duration:120ms!important}
  .tile.hint .gem,.node.cur{animation:none}
}
</style>

<div class="wrap">
  <header>

        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <button class="icon-btn" id="restartBtn" aria-label="Restart">

</div>

<!-- Bölüm sonu penceresi -->
<div class="overlay" id="over">
  <div class="dialog">
    <h2 id="dlgTitle"></h2>
    <div class="big" id="finalScore">0</div>
    <div class="rec" id="rec"></div>
    <div class="btns">
      <button class="btn blue hide" id="dlgAd"></button>
      <button class="btn green hide" id="dlgAlt"></button>
      <button class="btn" id="dlgMain"></button>
      <button class="btn ghost" id="dlgGhost"></button>
    </div>
  </div>
  <div class="adboard hide" id="adBoard"><span data-t="adLabel"></span><div class="adslot" id="adSlot"></div></div>
</div>

<!-- Harita -->
<div class="overlay" id="map">
  <div class="maptop">
    <button class="icon-btn" id="mapBack" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="grow" data-t="map"></div>
    <button class="pill" data-open="lives"><span data-icon="heart"></span><span class="livesVal"></span><small class="lifeTimer"></small></button>
    <button class="pill" data-open="shop"><i class="coin"></i><span class="coinsVal"></span></button>
  </div>
  <div class="mapscroll" id="mapScroll"><div class="mapinner" id="mapInner"></div></div>
</div>

<!-- Ana menü -->
<div class="overlay show" id="menu">
  <div class="mbg" id="menuBg"></div>
  <div class="mtop">
    <button class="pill" data-open="lives"><span data-icon="heart"></span><span class="livesVal"></span><small class="lifeTimer"></small></button>

// Zorluk eğrisi simülasyonla ayarlandı, özel bloklar dahil (scripts/zorluk_ozel_sim.py, formül "son", 200 deneme;
// "iyi oyuncu" geçme oranı): 1-3: 5 renk, ~%97 (öğrenme) | 4-8: ~%90 | 10: %84 | 20: ~%62 | 30+: ~%45-55 (güçlendiricilerle daha kolay)
const ICE_F = { c0: 8, cs: 2, cmax: 28, thickFrom: 14, tk: 3 };      // buz: kare sayısı, kalın buz hangi bölümden ve ne hızla
const STONE_F = { c0: 13, cs: 2, cmax: 20, hardFrom: 15, hk: 3 };    // kaya: sayı, 2 vuruşluk kaya hangi bölümden ve ne hızla
// Engellerin yeri: bölüme göre sabit (her denemede aynı), sağ-sol simetrik. Buz kenar ve köşelere konmaz (oralar çok zor)
function obstacleCells(n, count, kind) {
  const rand = seeded(n * 131 + kind * 7 + 11), out = [];
  while (out.length < count) {
    const r = 1 + Math.floor(rand() * (kind ? 5 : 6)), c = kind ? Math.floor(rand() * N / 2) : 1 + Math.floor(rand() * 3);
    for (const cc of [c, N - 1 - c]) { const k = r * N + cc; if (!out.includes(k) && out.length < count) out.push(k); }
  }
  return out;
}
function levelDef(n) {
  const gift = n % 3 === 0 ? ['hammer', 'plus5', 'clear'][(n / 3 - 1) % 3] : null; // her 3 bölümde bir hediye
  if (n <= EASY_LEVELS) return { n, moves: 20, type: 'score', target: [1900, 2200, 2500][n - 1], gift };
  const moves = 22 + Math.min(Math.floor((n - 4) / 3), 8);                     // 22 -> 30 hamle
  if (n % 4 === 0) {                                                           // her 4 bölümde bir "renk topla"
    const perMove = Math.min(.78 + (n - 4) * .022, 1.28);
    return { n, moves, type: 'collect', color: (n / 4 - 1) % K, count: Math.round(moves * perMove), gift };
  }
  if (n >= 6 && n % 4 === 2) {                                                 // 6, 10, 14...: "buzu kır"
    const cells = Math.min(ICE_F.c0 + Math.floor((n - 6) / 4) * ICE_F.cs, ICE_F.cmax);
    const thick = n >= ICE_F.thickFrom ? Math.min(Math.floor((n - ICE_F.thickFrom) / 4) * ICE_F.tk + 2, cells) : 0;
    return { n, moves, type: 'ice', ice: obstacleCells(n, cells, 0).map((k, i) => [k, i < thick ? 2 : 1]), count: cells, gift };
  }
  if (n >= 11 && n % 4 === 3) {                                                // 11, 15, 19...: "taşları kır"
    const cnt = Math.min(STONE_F.c0 + Math.floor((n - 11) / 4) * STONE_F.cs, STONE_F.cmax);
    const hard = n >= STONE_F.hardFrom ? Math.min(Math.floor((n - STONE_F.hardFrom) / 4) * STONE_F.hk + 2, cnt) : 0;
    return { n, moves, type: 'stone', stones: obstacleCells(n, cnt, 1).map((k, i) => [k, i < hard ? 2 : 1]), count: cnt, gift };
  }
  const perMove = Math.min(84 + (n - 4) * 1.9, 140);                           // hamle başına beklenen puan
  return { n, moves, type: 'score', target: Math.round(moves * perMove / 50) * 50, gift };
}

// ---------- Eşleşme mantığı ----------
function findMatches(m) {
  const set = new Set(), runs = []; let bonus = 0, maxRun = 0;
  const run = (len, cells, dir, color) => { if (len >= 3) { cells.forEach(k => set.add(k)); runs.push({ len, cells, dir, color }); maxRun = Math.max(maxRun, len); if (len > 3) bonus += (len - 3) * 30; } };
  for (let r = 0; r < N; r++) {
    let c = 0;
    while (c < N) {
      let e = c + 1;
      while (e < N && m[r][c] != null && m[r][e] === m[r][c]) e++;
      if (m[r][c] != null) run(e - c, Array.from({length:e - c}, (_, i) => r * N + c + i), 'h', m[r][c]);
      c = e;
    }
  }
  for (let c = 0; c < N; c++) {
    let r = 0;
    while (r < N) {
      let e = r + 1;
      while (e < N && m[r][c] != null && m[e][c] === m[r][c]) e++;
      if (m[r][c] != null) run(e - r, Array.from({length:e - r}, (_, i) => (r + i) * N + c), 'v', m[r][c]);
      r = e;
    }
  }
  return { set, bonus, maxRun, runs };
}
// Hangi eşleşmeden hangi özel blok doğar: 5'li düz -> prizma, L/T (kesişen iki sıra) -> bomba,
// 4'lü -> ışın (yatay 4'lü satırı, dikey 4'lü sütunu temizler). Blok, oyuncunun kaydırdığı karede doğar.
function planSpecials(runs, prefer) {
  const parent = runs.map((_, i) => i), owner = new Map();
  const find = i => parent[i] === i ? i : (parent[i] = find(parent[i]));
  runs.forEach((rn, i) => rn.cells.forEach(k => { if (owner.has(k)) parent[find(i)] = find(owner.get(k)); else owner.set(k, i); }));
  const groups = new Map();
  runs.forEach((rn, i) => { const g = find(i); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(rn); });
  const out = [];
  for (const rs of groups.values()) {
    const maxLen = Math.max(...rs.map(x => x.len));
    const hasH = rs.some(x => x.dir === 'h'), hasV = rs.some(x => x.dir === 'v');
    const sp = maxLen >= 5 ? 'p' : (hasH && hasV) ? 'b' : maxLen === 4 ? rs[0].dir : null;
    if (!sp) continue;
    const cells = [...new Set(rs.flatMap(x => x.cells))];
    let k = prefer ? prefer.find(p => cells.includes(p)) : undefined;
    if (k == null && sp === 'b') { const seen = new Set(); rs.forEach(x => x.cells.forEach(c => { if (seen.has(c)) k = c; seen.add(c); })); }
    if (k == null) { const lr = rs.find(x => x.len === maxLen); k = lr.cells[Math.floor((lr.len - 1) / 2)]; }
    out.push({ k, sp, color: rs[0].color, cells });
  }
  return out;
}
// Özel bloğun patlattığı kareler
function areaOf(sp, r, c) {
  const out = [];
  if (sp === 'h') for (let i = 0; i < N; i++) out.push(r * N + i);
  else if (sp === 'v') for (let i = 0; i < N; i++) out.push(i * N + c);
  else if (sp === 'b') for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    const rr = r + dr, cc = c + dc;
    if (rr >= 0 && rr < N && cc >= 0 && cc < N) out.push(rr * N + cc);
  }
  return out;
}
function commonColor() {
  const cnt = new Array(K).fill(0);
  grid.forEach(row => row.forEach(t => { if (t && t.color >= 0) cnt[t.color]++; }));
  return cnt.indexOf(Math.max(...cnt));
}
// Patlayacak kümedeki özel blokları tetikler (zincirleme); keep: bu turda yeni doğacak bloklar (patlamaz)
function expand(set, keep) {
  const fired = [], queue = [...set];
  while (queue.length) {
    const k = queue.pop(), r = Math.floor(k / N), c = k % N, t = grid[r][c];
    if (!t || !t.sp || t.fired) continue;
    t.fired = true;
    let area;
    if (t.sp === 'p') {
      const col = t.target != null ? t.target : commonColor();
      area = []; grid.forEach((row, rr) => row.forEach((x, cc) => { if (x && x.sp !== 'p' && x.color === col) area.push(rr * N + cc); }));
    } else area = areaOf(t.sp, r, c);
    fired.push({ r, c, sp: t.sp, color: t.color, area });
    for (const a of area) if (!set.has(a) && !keep.has(a)) { set.add(a); queue.push(a); }
  }
  return fired;
}
// Hamle var mı: önce normal eşleşme, yoksa özel blok takası (prizma her şeyle, iki özel blok birbiriyle)
function specialMove() {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) for (const [dr, dc] of [[0,1],[1,0]]) {
    const r2 = r + dr, c2 = c + dc;
    if (r2 >= N || c2 >= N) continue;
    const a = grid[r][c], b = grid[r2][c2];
    if (a && b && !a.stone && !b.stone && (a.sp === 'p' || b.sp === 'p' || (a.sp && b.sp))) return [[r,c],[r2,c2]];
  }
  return null;
}
const anyMove = () => findMove(colors()) || specialMove();
function findMove(m) {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    for (const [dr, dc] of [[0,1],[1,0]]) {
      const r2 = r + dr, c2 = c + dc;
      if (r2 >= N || c2 >= N || m[r][c] === m[r2][c2]) continue;
      [m[r][c], m[r2][c2]] = [m[r2][c2], m[r][c]];
      const ok = findMatches(m).set.size > 0;
      [m[r][c], m[r2][c2]] = [m[r2][c2], m[r][c]];
      if (ok) return [[r,c],[r2,c2]];
    }
  }
  return null;
}
function genColors() {
  let m;
  do {
    m = [];
    for (let r = 0; r < N; r++) {
      m[r] = [];
      for (let c = 0; c < N; c++) {
        let col;
        do { col = rnd(numColors); } while (
          (c >= 2 && m[r][c-1] === col && m[r][c-2] === col) ||
          (r >= 2 && m[r-1][c] === col && m[r-2][c] === col));
        m[r][c] = col;
      }
    }
  } while (!findMove(m));
  return m;
}

// ---------- Fon müziği (kodla üretilir; ses dosyası yok, telif sorunu yok) ----------
const music = { on:false, timer:0, next:0, step:0, out:null, bus:null };
const STEP = 60 / 84 / 2;
const CHORDS = [[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
const ARP = [0,1,2,1, 0,2,1,2, 0,1,2,1, 2,1,0,1];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function buildMusicBus() {
  buildMix(); music.out = ac.createGain(); music.out.gain.value = 0; music.out.connect(mix.music);
  music.bus = ac.createGain();
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
  const dl = ac.createDelay(1); dl.delayTime.value = STEP * 3;
  const fb = ac.createGain(); fb.gain.value = .32;
  const wet = ac.createGain(); wet.gain.value = .45;
  music.bus.connect(lp); lp.connect(music.out); lp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(music.out);
}
function mNote(f, t, dur, vol, type, att) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + att);
  g.gain.exponentialRampToValueAtTime(.0005, t + dur);
  o.connect(g); g.connect(music.bus); o.start(t); o.stop(t + dur + .05);
}
function scheduleMusic() {
  while (music.next < ac.currentTime + .3) {
    const t = music.next, pos = music.step % 16, ch = CHORDS[Math.floor(music.step / 16) % 4];
    if (pos === 0) {
      ch.forEach(m => { mNote(mtof(m), t, STEP * 16, .03, 'triangle', .8); mNote(mtof(m) * 1.004, t, STEP * 16, .018, 'sine', .8); });
      mNote(mtof(ch[0] - 12), t, STEP * 7, .08, 'sine', .03);
    }
    if (pos === 8) mNote(mtof(ch[0] - 12), t, STEP * 7, .06, 'sine', .03);
    if (pos % 2 === 0 || Math.random() < .3) {
      const m = ch[ARP[pos]] + 12 + (pos === 14 ? 12 : 0);
      mNote(mtof(m), t, STEP * 3, .045, 'sine', .006);
      mNote(mtof(m) * 2, t, STEP * 1.5, .012, 'triangle', .006);
    }
    music.next += STEP; music.step++;
  }
}
function startMusic() {
  if (!ac || music.on || sliderGain(settings.musicVol) <= 0 || document.hidden) return;
  if (!music.out) buildMusicBus();
  music.on = true; music.next = ac.currentTime + .1;
  music.out.gain.cancelScheduledValues(ac.currentTime);
  music.out.gain.setTargetAtTime(.45, ac.currentTime, .9);
  scheduleMusic(); music.timer = setInterval(scheduleMusic, 60);
}
function stopMusic() {
  if (!music.on) return;
  music.on = false; clearInterval(music.timer);
  music.out.gain.cancelScheduledValues(ac.currentTime);
  music.out.gain.setTargetAtTime(0, ac.currentTime, .12);
}
document.addEventListener('visibilitychange', () => {
  if (!ac) return;
  if (document.hidden) { stopMusic(); ac.suspend(); }
  else { ac.resume(); startMusic(); }
});

function tickLives() {

  if (save.lives >= MAX_LIVES) { save.lifeTs = now; return; }
  let changed = false;
  while (save.lives < MAX_LIVES && now - save.lifeTs >= LIFE_MS) { save.lives++; save.lifeTs += LIFE_MS; changed = true; }
  if (save.lives >= MAX_LIVES) save.lifeTs = now;
  if (changed) persist();
}
function loseLife() {

  save.lives = Math.max(0, save.lives - 1); persist(); renderPills();
}

// İki özel blok ya da prizma takası. A, (r,c) karesine gelen taş; B onun eski yerinde.
async function specialSwap(A, B, r, c, br, bc) {
  const all = new Set(), add = arr => arr.forEach(k => all.add(k));

  const ka = r * N + c, kB = br * N + bc;

    banner(T.spMega); sBoom(); play('prism', { delay: .05 }); play('smash', { delay: .1 }); sSub(1.3); buzz([50, 30, 90]);
    for (let i = 0; i < N * N; i++) all.add(i);
    A.fired = B.fired = true;
    specialFx({ r, c, sp: 'b', color: -1, area: [] }); specialFx({ r: br, c: bc, sp: 'b', color: -1, area: [] });
    await popCells(all, { power: 3, wave: true, noBanner: true, bonus: 500 });

  }
  if (P && X.sp) {                                                 // prizma + ışın/bomba: o rengin hepsi özel bloğa döner
    banner(T.spMega); play('prism'); play('forge', { rate: 1.2, delay: .08 }); buzz([30, 30, 60]);
    const col = X.color, targets = [];

    specialFx({ r: P === A ? r : br, c: P === A ? c : bc, sp: 'p', color: col, area: targets.map(([, rr, cc]) => rr * N + cc) });
    targets.forEach(([t], i) => setTimeout(() => setSp(t, X.sp === 'b' ? 'b' : (i % 2 ? 'h' : 'v')), 40 * i));
    await wait(40 * targets.length + 450);
    P.fired = true;
    add([ka, kB]); targets.forEach(([, rr, cc]) => all.add(rr * N + cc));
    await popCells(all, { power: 3, noBanner: true, bonus: 200 });
    return;

    P.target = X.color;

    add([ka, kB]);
    await popCells(all, { power: 2, noBanner: true, bonus: 100 });

    }

// Verilen taşları patlatır, puan/görev sayar, sonra yerçekimi ile yenilerini düşürür
async function popCells(set, o) {

  const fired = expand(set, keep);                       // kümedeki özel bloklar zincirleme patlar
  const power = Math.min((o.power || 0) + (fired.length ? 1 : 0), 4);
  fired.forEach(f => specialFx(f));

    if (f.sp === 'h' || f.sp === 'v') { play('beam', { delay: d, pan: f.sp === 'h' ? 0 : pan }); play('popBig', { delay: d + .02, vol: .7, pan }); }
    else if (f.sp === 'b') { play('thump', { delay: d, pan }); play('smash', { delay: d + .015, pan }); if (!i) sSub(); }
    else if (f.sp === 'p') { play('prism', { delay: d }); play('popBig', { delay: d + .1, vol: .6 }); play('pop', { rate: 1.5, vol: .5, delay: d + .18 }); }
  });

    const t = grid[Math.floor(k / N)][k % N];
    if (!t) return;

    setSp(t, p.sp, p.color); spIntro(p.sp);
  });

  set.forEach(k => { const t = tAt(k); if (t && t.stone) hit.add(k); });
  hit.forEach(k => set.delete(k));
  [...set, ...keep.keys()].forEach(k => {
    const r = Math.floor(k / N), c = k % N;
    [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]].forEach(([rr, cc]) => {
      if (rr >= 0 && rr < N && cc >= 0 && cc < N && grid[rr][cc] && grid[rr][cc].stone) hit.add(rr * N + cc);
    });
  });
  let stoneHits = 0;

    const t = tAt(k);
    t.stone = o.smash ? 0 : t.stone - 1; stoneHits++;
    if (t.stone <= 0) { set.add(k); stoneDone++; misAdd('stone', 1); return; }
    t.el.className = 'tile stone hp' + t.stone + ' hit';
    burst(Math.floor(k / N), k % N, -2, 0);
  });
  hit.forEach(k => {
    const t = tAt(k), pan = panOf(k % N);
    if (t.stone > 0) playL('rock', { vol: .85, pan });
    else { playL('rock', { rate: .84, pan }); playL('rubble', { delay: .05, pan }, 3); playL('rubble', { delay: .12, vol: .7, rate: .9, pan }, 3); }
  });
  keep.forEach((p, k) => hitIce(Math.floor(k / N), k % N));
  const pts = (set.size * 10 + (o.bonus || 0) + fired.length * 50 + stoneHits * 20) * combo;
  score += pts;
  if (!set.size) { updateUI(['score']); await wait(250); return; }
  misAdd('pop', set.size);
  let sr = 0, sc = 0;
  set.forEach(k => { sr += Math.floor(k / N); sc += k % N; });
  const cr = sr / set.size, cc = sc / set.size;
  floatText('+' + pts, cr, cc);
  if (!o.noBanner) {
    if (combo > 1) banner(`${T.combo} x${combo}!`);
    else if (o.maxRun >= 5) banner(T.amazing);
    else if (o.maxRun === 4) banner(T.great);
    if (power >= 1) flash(cr, cc);
    if (power >= 2 || set.size >= 6) quake();
  }
  let maxDelay = 0;
  set.forEach(k => {
    const r = Math.floor(k / N), c = k % N, t = grid[r][c];
    if (!t) return;
    if (def && def.type === 'collect' && t.color === def.color) collected++;
    hitIce(r, c);
    grid[r][c] = null;
    let delay = o.wave ? (Math.abs(r - 3.5) + Math.abs(c - 3.5)) * 40 : 0;
    if (!o.wave && fired.length)                          // patlama, tetiklenen bloktan dışa doğru yayılır
      delay = Math.min(...fired.map(f => Math.max(Math.abs(r - f.r), Math.abs(c - f.c)))) * 35;
    maxDelay = Math.max(maxDelay, delay);

    setTimeout(() => burst(r, c, t.color, power), delay + 90);
    setTimeout(() => t.el.remove(), delay + 300);
  });
  sPop(combo, panOf(cc));
  buzz(power >= 2 ? 35 : 12);
  updateUI(['score']);
  await wait(270 + maxDelay);

  let maxD = 0; const fresh = [];
  for (let c = 0; c < N; c++) {
    let w = N - 1;
    for (let r = N - 1; r >= 0; r--) {
      const t = grid[r][c];
      if (!t) continue;
      if (r !== w) { grid[w][c] = t; grid[r][c] = null; place(t, w, c, fallDur(w - r)); land(t, fallDur(w - r) * .8); maxD = Math.max(maxD, w - r); }
      w--;
    }
    const cnt = w + 1;
    for (let r = 0; r <= w; r++) {
      const t = makeTile(rnd(numColors), r, c, r - cnt);
      grid[r][c] = t; fresh.push([t, r, c, cnt]); maxD = Math.max(maxD, cnt);

  }

  fresh.forEach(([t, r, c, d]) => { place(t, r, c, fallDur(d)); land(t, fallDur(d) * .8); });
  play('land', { delay: fallDur(maxD) * .75 / 1000 });
  await wait(fallDur(maxD) + 40);
}
async function resolve(startCombo, prefer) {
  let combo = startCombo || 1;
  for (;;) {
    const m = findMatches(colors());
    if (!m.set.size) break;
    const keep = new Map();
    for (const p of planSpecials(m.runs, prefer)) {
      let k = p.k;
      const at = x => grid[Math.floor(x / N)][x % N];
      if (at(k).sp || keep.has(k)) k = p.cells.find(x => !at(x).sp && !keep.has(x));   // var olan özel blok patlasın
      if (k == null) continue;
      keep.set(k, p); m.set.delete(k);
    }
    prefer = null;
    const power = Math.min((m.maxRun - 3) + (combo - 1), 4);
    await popCells(m.set, { combo, bonus: m.bonus, maxRun: m.maxRun, power, keep });
    combo++;
  }
}
async function afterTurn() {
  if (mode === 'level' && goalDone()) { finished = true; busy = false; levelWin(); return; }
  if (mode === 'level' && moves <= 0) { finished = true; busy = false; levelFail(); return; }
  if (!anyMove()) await reshuffle();
  busy = false; armHint();
}

function missions() {
  const today = new Date().toDateString();
  if (save.mis && save.mis.day === today) return save.mis.list;
  const d = new Date(), rand = seeded(d.getFullYear() * 400 + d.getMonth() * 32 + d.getDate());
  const pool = MISSIONS.filter(m => !m.from || save.unlocked > m.from), list = [];
  while (list.length < 3 && pool.length) {
    const m = pool.splice(Math.floor(rand() * pool.length), 1)[0], hard = rand() < .5 ? 1 : 0;
    list.push({ id: m.id, n: m.n[hard], r: m.r[hard], p: 0, c: 0 });
  }
  save.mis = { day: today, list }; persist();
  return list;
}

    if (m.id !== id || m.p >= m.n) continue;

    if (m.p >= m.n) setTimeout(() => toast(`${T.misDone} ${misText(m)}`, 2600), 700);

const cf = document.createElement('canvas'); cf.id = 'confetti'; document.body.appendChild(cf);
function confetti() {
  const x = cf.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
  cf.width = W * dpr; cf.height = H * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const ps = Array.from({ length: 120 }, () => ({
    x: Math.random() * W, y: -20 - Math.random() * H * .5, vx: (Math.random() - .5) * 140, vy: 140 + Math.random() * 220,
    r: Math.random() * 6, vr: (Math.random() - .5) * 10, w: 6 + Math.random() * 6, h: 9 + Math.random() * 8,
    c: FXCOL[Math.floor(Math.random() * FXCOL.length)]
  }));
  const t0 = performance.now(); let last = t0;
  const step = now => {
    const dt = Math.min((now - last) / 1000, .05); last = now;
    x.clearRect(0, 0, W, H);
    const a = Math.max(0, 1 - (now - t0) / 3200);
    for (const p of ps) {
      p.vy += 90 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.globalAlpha = a; x.fillStyle = p.c;
      x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 1.3))); x.restore();
    }
    if (a > 0) requestAnimationFrame(step); else x.clearRect(0, 0, W, H);
  };
  requestAnimationFrame(step);
}

function seeded(seed) { return () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }; }
function buildMap() {
  const inner = $('mapInner'), w = Math.min($('mapScroll').clientWidth || 360, 480);
  const L = Math.min(MAX_LEVEL, Math.max(save.unlocked + 9, 20));
  const GAP = 104, H = L * GAP + 200;
  inner.style.height = H + 'px';
  const pts = [];
  for (let i = 1; i <= L; i++) pts.push({ x: w / 2 + Math.sin(i * .85) * w * .3, y: H - 120 - (i - 1) * GAP });
  const pathTo = n => {
    let d = `M${pts[0].x.toFixed(1)},${pts[0].y}`;
    for (let i = 1; i < n; i++) {
      const a = pts[i - 1], b = pts[i], ym = (a.y + b.y) / 2;
      d += ` C${a.x.toFixed(1)},${ym} ${b.x.toFixed(1)},${ym} ${b.x.toFixed(1)},${b.y}`;
    }
    return d;
  };
  const full = pathTo(L), done = pathTo(Math.min(save.unlocked, L));
  const rand = seeded(7);
  let decor = '';
  for (let i = 0; i < L * 3; i++) {
    const s = 1 + rand() * 3;
    decor += `<i class="dot" style="left:${(rand() * 100).toFixed(1)}%;top:${(rand() * H).toFixed(0)}px;width:${s}px;height:${s}px;opacity:${(.15 + rand() * .5).toFixed(2)}"></i>`;
  }
  let nodes = '';
  pts.forEach((p, i) => {
    const n = i + 1, d = levelDef(n), st = save.stars[n] || 0;
    const cls = n < save.unlocked || (st && n !== save.unlocked) ? 'done' : n === save.unlocked ? 'cur' : 'locked';
    let badge = '';
    if (d.gift && !save.gifts[n]) badge = `<span class="badge">${ICON.gift}</span>`;
    else if (d.type === 'collect') badge = `<span class="badge gem g${d.color}"></span>`;
    else if (d.type === 'ice' || d.type === 'stone') badge = `<span class="badge gem b${d.type}"></span>`;
    const stars = st ? `<span class="st">${'★'.repeat(st)}<em>${'★'.repeat(3 - st)}</em></span>` : '';
    nodes += `<button class="node ${cls}" data-n="${n}" style="left:${p.x.toFixed(1)}px;top:${p.y}px">${n}${badge}${stars}</button>`;
  });
  inner.innerHTML =
    `<svg width="${w}" height="${H}" viewBox="0 0 ${w} ${H}">
       <path class="road-base" d="${full}"/><path class="road" d="${full}"/><path class="road-dash" d="${full}"/>
       <path class="road-done" d="${done}"/></svg>` + decor + nodes;
  inner.style.width = w + 'px';
  return pts[Math.min(save.unlocked, L) - 1];
}

// ---------- Reklamlar (AdMob) ----------
// Geçiş reklamı: ilk 3 bölümde yok, sonra her 2 bölüm sonunda bir; "Reklamları Kaldır" alınınca hiç yok.
// Ödüllü reklam: oyuncu kendisi seçer (+1 can, +5 hamle, bedava altın); reklamsız sürümde de isteğe bağlı kalır.
const Ads = {
  ready: false, privacyNeeded: false, ends: 0,
  async init() {
    if (!NATIVE) return;
    const A = NATIVE.AdMob;
    try {
      const ci = await A.requestConsentInfo();
      if (ci.isConsentFormAvailable && ci.status === 'REQUIRED') await A.showConsentForm();
      const c2 = await A.requestConsentInfo();
      this.privacyNeeded = c2.privacyOptionsRequirementStatus === 'REQUIRED';
    } catch (e) {}
    try { await A.initialize({ initializeForTesting: CONFIG.adsTesting }); this.ready = true; } catch (e) {}
    syncPrivacyUI();
  },
  boardOn: false, boardTok: 0,
  async showBoard() {
    if (save.noAds || this.boardOn) return;
    if (!NATIVE && !DEV) return;
    if (NATIVE && !this.ready) return;
    if (window.__storeShot) return;   // mağaza görselinde boş reklam alanı görünmesin
    this.boardOn = true; const tok = ++this.boardTok;
    document.body.classList.add('board-on');
    $('adBoard').classList.remove('hide');
    $('adSlot').classList.toggle('mock', !NATIVE);
    $('adSlot').textContent = NATIVE ? '' : `${T.adLabel} 300×250`;
    if (!NATIVE) return;
    await wait(120);
    if (tok !== this.boardTok) return;
    const r = $('adSlot').getBoundingClientRect();
    const margin = Math.max(0, Math.round(window.innerHeight - r.bottom));
    try {
      await NATIVE.AdMob.showBanner({ ...Privacy.adOptions(CONFIG.bannerId), adSize: 'MEDIUM_RECTANGLE', position: 'BOTTOM_CENTER', margin });
      if (tok !== this.boardTok) NATIVE.AdMob.removeBanner().catch(() => {});
    } catch (e) {}
  },
  hideBoard() {
    if (!this.boardOn) return;
    this.boardOn = false; this.boardTok++;
    document.body.classList.remove('board-on');
    $('adBoard').classList.add('hide');
    if (NATIVE && this.ready) NATIVE.AdMob.removeBanner().catch(() => {});
  },
  async levelEnd() {
    if (save.noAds) return;
    this.ends++;
    if (level < CONFIG.firstAdLevel || this.ends % CONFIG.interstitialEvery !== 0) return;
    await this.interstitial();
  },
  async endlessCheck() {
    if (save.noAds || !endlessStart || Date.now() - endlessStart < CONFIG.endlessAdMs) return;
    endlessStart = Date.now();
    await this.interstitial();
  },
  async interstitial() {
    if (NATIVE) {
      if (!this.ready) return;
      const A = NATIVE.AdMob;
      pauseAudio();
      try {
        await A.prepareInterstitial(Privacy.adOptions(CONFIG.interstitialId));
        const done = adEvents(['interstitialAdDismissed', 'interstitialAdFailedToShow']);
        await A.showInterstitial(); await done;
      } catch (e) {}
      resumeAudio();
    } else if (DEV) await mockAd();
  },
  async rewarded() {
    if (NATIVE) {
      if (!this.ready) { toast(T.adNotReady); return false; }
      const A = NATIVE.AdMob;
      let got = false;
      const h = await A.addListener('onRewardedVideoAdReward', () => { got = true; });
      pauseAudio();
      try {
        await A.prepareRewardVideoAd(Privacy.adOptions(CONFIG.rewardedId));
        const done = adEvents(['onRewardedVideoAdDismissed', 'onRewardedVideoAdFailedToShow']);
        const item = await A.showRewardVideoAd();
        if (item && item.amount) got = true;
        await done; await wait(250);
      } catch (e) { toast(T.adNotReady); }
      h.remove(); resumeAudio();
      return got;
    }
    if (DEV) return mockAd();
    toast(T.adNotReady); return false;
  }
};
function adEvents(names) {
  const A = NATIVE.AdMob;
  return new Promise(res => {
    const hs = []; let done = false;
    const fin = () => { if (done) return; done = true; hs.forEach(p => p.then(h => h.remove())); res(); };
    names.forEach(n => hs.push(Promise.resolve(A.addListener(n, fin))));
    setTimeout(fin, 120000);
  });
}
function pauseAudio() { stopMusic(); if (ac) ac.suspend(); }
function resumeAudio() { if (ac) ac.resume(); startMusic(); }
// Bilgisayarda test için sahte reklam (yalnızca localhost'ta görünür)
function mockAd() {
  return new Promise(res => {
    const m = $('adMock'), btn = $('adMockClose');
    let n = 3; btn.disabled = true; btn.textContent = n;
    m.classList.add('show'); pauseAudio();
    const iv = setInterval(() => { n--; if (n > 0) btn.textContent = n; else { clearInterval(iv); btn.disabled = false; btn.textContent = T.close; } }, 1000);
    btn.onclick = () => { if (btn.disabled) return; m.classList.remove('show'); resumeAudio(); res(true); };
  });
}

// ---------- Uygulama içi satın alma (Google Play Billing) ----------
const Shop = {
  ready: false,
  async init() {
    if (!NATIVE) return;
    const { store, ProductType, Platform } = NATIVE, P = Platform.GOOGLE_PLAY;
    store.register([
      { id: CONFIG.noAdsId, type: ProductType.NON_CONSUMABLE, platform: P },
      ...Object.keys(CONFIG.coinPacks).map(id => ({ id, type: ProductType.CONSUMABLE, platform: P }))
    ]);
    store.when()
      .productUpdated(() => { if ($('shop').classList.contains('show')) renderShop(); })
      .approved(tx => { this.grant(tx); tx.finish(); });
    try { await store.initialize([P]); this.ready = true; } catch (e) {}
    if (store.owned(CONFIG.noAdsId)) setNoAds(false);
  },
  grant(tx) {
    const tid = tx.transactionId;
    save.txs = save.txs || [];
    for (const p of tx.products || []) {
      if (p.id === CONFIG.noAdsId) setNoAds(true);
      else if (CONFIG.coinPacks[p.id]) {
        if (save.txs.includes(tid)) continue;     // aynı satın alma iki kez sayılmasın
        save.txs.push(tid); if (save.txs.length > 100) save.txs.shift();
        save.coins += CONFIG.coinPacks[p.id];
        persist(); renderPills(); sCoin(); toast(T.bought);
        if ($('shop').classList.contains('show')) renderShop();
      }
    }
  },
  price(id) {
    if (!NATIVE || !this.ready) return null;
    const p = NATIVE.store.get(id);
    return p && p.pricing ? p.pricing.price : null;
  },
  async buy(id) {
    if (NATIVE) {
      const p = this.ready && NATIVE.store.get(id), o = p && p.getOffer();
      if (!o) { toast(T.storeNA); return; }
      const err = await o.order();
      if (err && !/cancel/i.test(err.message || '')) toast(err.message || T.storeNA);
      return;
    }
    if (DEV) { this.grant({ transactionId: 'dev-' + Date.now(), products: [{ id }] }); return; }
    toast(T.storeNA);
  },
  async restore() {
    if (!NATIVE || !this.ready) { toast(T.storeNA); return; }
    try { await NATIVE.store.restorePurchases(); } catch (e) {}
    if (NATIVE.store.owned(CONFIG.noAdsId)) setNoAds(false);
    toast(T.restored);
  }
};
function setNoAds(announce) {
  if (save.noAds) return;
  save.noAds = true; persist(); Ads.hideBoard();
  if (announce) { toast(T.adsRemoved); sCoin(); buzz([30, 50, 30]); }
  if ($('shop').classList.contains('show')) renderShop();
}

// ---------- Dokunma / kaydırma ----------
let start = null;
function cellAt(e) {
  const rect = board.getBoundingClientRect();
  const c = Math.floor((e.clientX - rect.left) / rect.width * N);
  const r = Math.floor((e.clientY - rect.top) / rect.height * N);
  return (r >= 0 && r < N && c >= 0 && c < N) ? { r, c } : null;
}
board.addEventListener('pointerdown', e => {
  initAudio();
  if (busy || locked()) return;
  const cell = cellAt(e); if (!cell) return;
  e.preventDefault();
  if (aiming === 'hammer') { useHammer(cell.r, cell.c); return; }
  start = { ...cell, x: e.clientX, y: e.clientY, moved: false };
  try { board.setPointerCapture(e.pointerId); } catch (err) {}
});
board.addEventListener('pointermove', e => {
  if (!start || start.moved) return;
  const dx = e.clientX - start.x, dy = e.clientY - start.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < board.clientWidth / N * 0.3) return;
  start.moved = true;
  let r2 = start.r, c2 = start.c;
  if (Math.abs(dx) > Math.abs(dy)) c2 += Math.sign(dx); else r2 += Math.sign(dy);
  if (r2 >= 0 && r2 < N && c2 >= 0 && c2 < N) trySwap(start.r, start.c, r2, c2);
});
board.addEventListener('pointerup', () => {
  if (!start) return;
  const s = start; start = null;
  if (s.moved || busy) return;
  if (sel) {
    if (sel.r === s.r && sel.c === s.c) { clearSel(); return; }
    if (Math.abs(sel.r - s.r) + Math.abs(sel.c - s.c) === 1) { const a = sel; trySwap(a.r, a.c, s.r, s.c); return; }
  }
  setSel(s.r, s.c);
});
board.addEventListener('pointercancel', () => { start = null; });
board.addEventListener('contextmenu', e => e.preventDefault());
